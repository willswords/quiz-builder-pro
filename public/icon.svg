<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0049CD" />
      <stop offset="100%" stop-color="#002D59" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7900" />
      <stop offset="100%" stop-color="#FF5F1F" />
    </linearGradient>
    <linearGradient id="avocadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79AD30" />
      <stop offset="100%" stop-color="#5E8F24" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#sapphireGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Quiz Card / Clipboard Shape -->
  <rect x="120" y="116" width="272" height="310" rx="36" fill="#FFFFFF" opacity="0.96" filter="drop-shadow(0 16px 32px rgba(0,0,0,0.25))" />
  
  <!-- Clip Accent (Avocado green) -->
  <rect x="206" y="96" width="100" height="40" rx="16" fill="url(#avocadoGrad)" />
  
  <!-- Quiz Lines / Elements -->
  <rect x="160" y="176" width="140" height="20" rx="10" fill="#0049CD" />
  <rect x="160" y="214" width="192" height="14" rx="7" fill="#64748B" opacity="0.6" />
  <rect x="160" y="240" width="160" height="14" rx="7" fill="#64748B" opacity="0.4" />
  
  <!-- Option Checkmarks / Badges -->
  <!-- Correct option badge (Avocado green) -->
  <circle cx="182" cy="296" r="18" fill="url(#avocadoGrad)" />
  <path d="M174 296 L180 302 L191 290" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="212" y="289" width="130" height="14" rx="7" fill="#0049CD" opacity="0.8" />
  
  <!-- Safety Neon highlight option -->
  <circle cx="182" cy="354" r="18" fill="url(#neonGrad)" />
  <circle cx="182" cy="354" r="8" fill="#FFFFFF" />
  <rect x="212" y="347" width="110" height="14" rx="7" fill="#FF5F1F" opacity="0.75" />
</svg>
